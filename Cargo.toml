[workspace]
members = [
  "crates/speechcpp-client",
  "crates/config",
  "crates/audio",
  "crates/speak",
  "crates/server",
  "apps/tray",
  "apps/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
speechcpp-client = { path = "crates/speechcpp-client" }
mozu-config = { path = "crates/config" }
mozu-audio = { path = "crates/audio" }
mozu-speak = { path = "crates/speak" }
mozu-server = { path = "crates/server" }
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tray-icon = { version = "0.26.1", default-features = false }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.48", features = ["rt", "time", "net", "macros"] }
url = "2.5"
toml_edit = "0.25"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "allow"
