name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = (cargo metadata --locked --no-deps --format-version 1) | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'mozu-cli').version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'タグと Cargo のバージョンが一致しません' }
      - name: Check and package
        run: ./scripts/package.ps1
      - name: Verify binaries and installation
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'dist/release'
          & (Join-Path $releaseDir 'mozu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'exe version check failed' }
          & (Join-Path $releaseDir 'mozu.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'exe help check failed' }
          $env:APPDATA = "$env:RUNNER_TEMP/mozu-smoke-appdata"
          $installed = "$env:RUNNER_TEMP/mozu-installed"
          $installer = Join-Path $releaseDir 'install.ps1'
          & $installer -ReleaseDir $releaseDir -Dir $installed -NoStart -NoPath -SkipSpeech
          & (Join-Path $installed 'mozu.exe') say --show GitHub
          if ($LASTEXITCODE -ne 0) { throw 'say check failed' }
          & (Join-Path $installed 'mozu.exe') config --path
          if ($LASTEXITCODE -ne 0) { throw 'config check failed' }
          $config = Join-Path $env:APPDATA 'mozu/config.toml'
          $readings = Join-Path $env:APPDATA 'mozu/readings.toml'
          $before = @((Get-FileHash $config).Hash, (Get-FileHash $readings).Hash)
          & (Join-Path $installed 'scripts/install.ps1') -ReleaseDir $releaseDir -Dir $installed -NoStart -NoPath -SkipSpeech
          $after = @((Get-FileHash $config).Hash, (Get-FileHash $readings).Hash)
          if (Compare-Object $before $after) { throw '更新で設定または辞書が変わりました' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(Get-ChildItem dist/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title $env:RELEASE_TAG --generate-notes
          gh release edit $env:RELEASE_TAG --draft=false
